name: Backend Batch Server CI

on:
  workflow_dispatch:

  push:
    branches: [ "develop", "feature/**" ]
    paths:
      - 'batch-server/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'batch-server/**'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew :batch-server:clean build -x test

      - name: Run Specific Batch Job
        run: ./gradlew :batch-server:test --tests "com.finance.batch.**.*Test"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16
        if: always()
        with:
          report_paths: ${{ github.workspace }}/batch-server/build/test-results/test/*.xml

      - name: Jacoco Report to PR
        id: jacoco
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920
        with:
          paths: ${{ github.workspace }}/batch-server/build/reports/jacoco/testCoverage/testCoverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 50
          update-comment: true