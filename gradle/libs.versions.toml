[versions]
# kotlin
kotlin = "2.3.10"

# spring boot
springBoot = "3.5.12"
dependencyManagement = "1.1.7"

[plugins]
kotlin-jvm = {id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
